<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set Password — Revizto ↔ ACC Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- Standalone page (no sidebar): reached from an emailed link while signed out. -->
  <div id="app" class="container">
    <header class="app-header">
      <div>
        <h1 id="pw-title">Set your password</h1>
        <p class="app-sub" id="pw-sub">Checking your link…</p>
      </div>
    </header>
    <section class="card">
      <form id="pw-form" class="signin-form hidden" novalidate>
        <label for="pw-input">New password</label>
        <input id="pw-input" type="password" autocomplete="new-password" minlength="10" required />
        <label for="pw-confirm">Confirm new password</label>
        <input id="pw-confirm" type="password" autocomplete="new-password" minlength="10" required />
        <p class="hint">At least 10 characters.</p>
        <div class="signin-actions">
          <button id="pw-submit" type="submit" class="btn">Save password</button>
        </div>
      </form>
      <div id="pw-result" class="whoami" role="status"></div>
      <p><a href="/account" id="pw-signin-link" class="hidden">Go to sign in</a></p>
    </section>
  </div>
  <script src="/js/reset-password.js"></script>
</body>
</html>
